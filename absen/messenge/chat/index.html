<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Grup Chat Bisnis - Absensi Karyawan</title>
  <style>
    :root {
      --bg: #f3f6f8;
      --surface: #ffffff;
      --surface-soft: #f8fafc;
      --text: #0f172a;
      --text-secondary: #475569;
      --muted: #64748b;
      --border: rgba(203, 213, 225, 0.72);
      --primary: #0f766e;
      --primary-dark: #115e59;
      --primary-light: #14b8a6;
      --primary-bg: #f0fdfa;
      --success: #059669;
      --danger: #e11d48;
      --warning: #d97706;
      --warning-bg: #fef3c7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100dvh;
      max-width: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.42;
      font-size: 13px;
      -webkit-text-size-adjust: 100%;
    }

    @keyframes msgPop {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .chat-app {
      width: 100%;
      max-width: 440px;
      height: 100dvh;
      margin: 0 auto;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      position: relative;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
    }

    .chat-header {
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      padding: 9px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      z-index: 20;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }

    .back-btn {
      width: 34px;
      height: 34px;
      border-radius: 11px;
      border: 1px solid var(--border);
      background: var(--surface-soft);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      flex-shrink: 0;
    }

    .room-avatar {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: linear-gradient(135deg, #115e59, #14b8a6);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 3px 10px rgba(15, 118, 110, 0.22);
    }

    .room-info {
      min-width: 0;
      flex: 1;
    }

    .room-title {
      font-size: 13.5px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .room-sub {
      font-size: 10.5px;
      font-weight: 600;
      color: var(--success);
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .online-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--success);
      flex-shrink: 0;
    }

    .user-badge {
      flex-shrink: 0;
      background: var(--primary-bg);
      border: 1px solid rgba(15, 118, 110, 0.2);
      color: var(--primary);
      padding: 3px 8px 3px 4px;
      border-radius: 999px;
      font-size: 10.5px;
      font-weight: 800;
      max-width: 125px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .badge-mini-avatar {
      width: 20px;
      height: 20px;
      border-radius: 999px;
      background: #ccfbf1;
      color: var(--primary-dark);
      font-size: 9.5px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }

    .badge-mini-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Bar daftar grup khusus bisnis pengguna */
    .group-bar {
      flex-shrink: 0;
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      padding: 7px 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .group-bar::-webkit-scrollbar {
      display: none;
    }

    .group-chip {
      border: 1px solid var(--border);
      background: var(--surface-soft);
      color: var(--text-secondary);
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.14s ease;
    }

    .group-chip.active {
      background: linear-gradient(135deg, #0f766e, #14b8a6);
      border-color: transparent;
      color: #ffffff;
      box-shadow: 0 3px 8px rgba(15, 118, 110, 0.22);
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      scroll-behavior: smooth;
    }

    .date-divider {
      align-self: center;
      background: rgba(226, 232, 240, 0.85);
      color: var(--text-secondary);
      font-size: 10.5px;
      font-weight: 700;
      padding: 3px 11px;
      border-radius: 999px;
      margin: 4px 0;
    }

    .msg-row {
      display: flex;
      align-items: flex-end;
      gap: 7px;
      max-width: 84%;
      animation: msgPop 0.18s ease;
    }

    .msg-row.mine {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .msg-row.other {
      align-self: flex-start;
    }

    .msg-avatar {
      width: 30px;
      height: 30px;
      border-radius: 10px;
      background: #ccfbf1;
      color: var(--primary-dark);
      font-size: 11px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      text-transform: uppercase;
      flex-shrink: 0;
      overflow: hidden;
      border: 1px solid var(--border);
      cursor: pointer;
    }

    .msg-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .msg-bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px 16px 16px 4px;
      padding: 8px 11px;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.04);
      position: relative;
      min-width: 72px;
      word-wrap: break-word;
      overflow-wrap: anywhere;
    }

    .msg-row.mine .msg-bubble {
      background: linear-gradient(135deg, #0f766e, #0d9488);
      color: #ffffff;
      border-color: transparent;
      border-radius: 16px 16px 4px 16px;
      box-shadow: 0 4px 12px rgba(15, 118, 110, 0.2);
    }

    .msg-sender {
      font-size: 11px;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 2px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .verified-badge {
      width: 14px;
      height: 14px;
      object-fit: contain;
      display: inline-block;
      vertical-align: middle;
      flex-shrink: 0;
    }

    .reply-quote {
      background: rgba(15, 23, 42, 0.05);
      border-left: 3px solid var(--primary);
      border-radius: 7px;
      padding: 4px 7px;
      margin-bottom: 5px;
      font-size: 11px;
    }

    .msg-row.mine .reply-quote {
      background: rgba(255, 255, 255, 0.16);
      border-left-color: #ccfbf1;
    }

    .reply-quote-name {
      font-weight: 800;
      font-size: 10px;
      margin-bottom: 1px;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    .reply-quote-text {
      opacity: 0.9;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .msg-photo {
      display: block;
      width: 100%;
      max-width: 220px;
      max-height: 220px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 5px;
      cursor: pointer;
    }

    .msg-text {
      font-size: 13px;
      line-height: 1.42;
      white-space: pre-line;
    }

    .msg-meta {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 7px;
      margin-top: 3px;
      font-size: 9.5px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .msg-row.mine .msg-meta {
      color: rgba(255, 255, 255, 0.82);
    }

    .msg-action-link {
      border: none;
      background: transparent;
      color: inherit;
      font-size: 9.5px;
      font-weight: 700;
      cursor: pointer;
      opacity: 0.85;
      padding: 0;
    }

    .composer-wrap {
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      padding: 8px 10px calc(9px + env(safe-area-inset-bottom, 0px));
      display: flex;
      flex-direction: column;
      gap: 7px;
      z-index: 20;
    }

    .preview-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: var(--primary-bg);
      border: 1px solid rgba(15, 118, 110, 0.22);
      border-left: 3.5px solid var(--primary);
      border-radius: 10px;
      padding: 6px 9px;
      font-size: 11.5px;
    }

    .preview-strip-info {
      min-width: 0;
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .preview-strip-thumb {
      width: 36px;
      height: 36px;
      border-radius: 7px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .preview-strip-title {
      font-weight: 800;
      color: var(--primary);
      font-size: 11px;
    }

    .preview-strip-desc {
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 11px;
    }

    .strip-close-btn {
      width: 22px;
      height: 22px;
      border-radius: 999px;
      border: none;
      background: rgba(15, 23, 42, 0.08);
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
    }

    .composer-row {
      display: flex;
      align-items: flex-end;
      gap: 7px;
    }

    .attach-btn {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface-soft);
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .chat-input-box {
      flex: 1;
      min-width: 0;
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 8px 11px;
      display: flex;
      align-items: center;
    }

    .chat-input-box:focus-within {
      border-color: var(--primary);
      background: #ffffff;
    }

    .chat-textarea {
      width: 100%;
      max-height: 92px;
      border: none;
      background: transparent;
      font-family: inherit;
      font-size: 13px;
      color: var(--text);
      resize: none;
      outline: none;
      line-height: 1.38;
    }

    .send-btn {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #0f766e, #14b8a6);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(15, 118, 110, 0.25);
    }

    .send-btn:disabled, .attach-btn:disabled {
      background: #cbd5e1;
      color: #64748b;
      box-shadow: none;
      cursor: not-allowed;
    }

    .img-modal {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.95);
      z-index: 200;
      max-width: 440px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
    }

    .img-modal-top {
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #ffffff;
    }

    .img-modal-close {
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      padding: 5px 11px;
      border-radius: 9px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
    }

    .img-modal-body {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }

    .img-modal-body img {
      max-width: 100%;
      max-height: 100%;
      border-radius: 12px;
      object-fit: contain;
    }

    .empty-chat {
      margin: auto;
      text-align: center;
      color: var(--muted);
      padding: 20px;
      font-size: 12.5px;
      max-width: 280px;
    }

    .hidden {
      display: none !important;
    }

    .toast {
      position: fixed;
      left: 50%;
      top: 62px;
      transform: translateX(-50%) translateY(-10px);
      width: calc(100% - 28px);
      max-width: 412px;
      background: #0f172a;
      color: #ffffff;
      padding: 9px 13px;
      border-radius: 11px;
      font-size: 12px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 300;
      text-align: center;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.2);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div class="chat-app">
    <header class="chat-header">
      <div class="header-left">
        <a href="https://my.sitenexs.com/absen.html" class="back-btn" id="backToAbsenBtn" aria-label="Kembali">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </a>
        <div class="room-avatar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
        </div>
        <div class="room-info">
          <div class="room-title" id="activeGroupTitle">Grup Bisnis</div>
          <div class="room-sub">
            <span class="online-dot"></span>
            <span id="businessSubLabel">Memeriksa bisnis...</span>
          </div>
        </div>
      </div>
      <div class="user-badge" id="currentUserBadge">-</div>
    </header>

    <!-- Daftar Grup Khusus Bisnis yang Sama -->
    <div class="group-bar" id="groupBar">
      <span class="group-chip active">Memuat grup...</span>
    </div>

    <main class="chat-messages" id="chatMessages">
      <div class="empty-chat">Memuat grup &amp; percakapan bisnis Anda...</div>
    </main>

    <footer class="composer-wrap">
      <div id="replyStrip" class="preview-strip hidden">
        <div class="preview-strip-info">
          <div style="min-width:0;">
            <div class="preview-strip-title" id="replyTargetName">Membalas -</div>
            <div class="preview-strip-desc" id="replyTargetText">-</div>
          </div>
        </div>
        <button type="button" class="strip-close-btn" id="cancelReplyBtn" aria-label="Batal balas">&times;</button>
      </div>

      <div id="photoStrip" class="preview-strip hidden">
        <div class="preview-strip-info">
          <img id="photoStripThumb" class="preview-strip-thumb" alt="Lampiran">
          <div style="min-width:0;">
            <div class="preview-strip-title">Lampiran Foto</div>
            <div class="preview-strip-desc">Siap dikirim ke grup</div>
          </div>
        </div>
        <button type="button" class="strip-close-btn" id="cancelPhotoBtn" aria-label="Hapus foto">&times;</button>
      </div>

      <div class="composer-row">
        <button type="button" class="attach-btn" id="pickPhotoBtn" aria-label="Kirim Foto" title="Kirim Foto" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <circle cx="8.5" cy="8.5" r="1.5"></circle>
            <polyline points="21 15 16 10 5 21"></polyline>
          </svg>
        </button>
        <input type="file" id="chatPhotoInput" accept="image/*" class="hidden">

        <div class="chat-input-box">
          <textarea id="chatInput" class="chat-textarea" rows="1" placeholder="Tulis pesan untuk grup bisnis..." disabled></textarea>
        </div>

        <button type="button" class="send-btn" id="sendMsgBtn" aria-label="Kirim" disabled>
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </footer>
  </div>

  <div id="imgModal" class="img-modal hidden">
    <div class="img-modal-top">
      <span style="font-weight:700; font-size:13px;" id="imgModalSender">Foto</span>
      <button type="button" class="img-modal-close" id="closeImgModalBtn">Tutup</button>
    </div>
    <div class="img-modal-body">
      <img id="imgModalTarget" alt="Pratinjau Foto">
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";
    import {
      getFirestore,
      collection,
      doc,
      setDoc,
      deleteDoc,
      query,
      where,
      limit,
      onSnapshot
    } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const firebaseConfig = {
      apiKey: "AIzaSyDuN4zlRaSnmcUSuXE_E84IE7d3Mz8E-N4",
      authDomain: "sitenexs-62919.firebaseapp.com",
      projectId: "sitenexs-62919",
      storageBucket: "sitenexs-62919.firebasestorage.app",
      messagingSenderId: "1060348110644",
      appId: "1:1060348110644:web:e45af14d5f26a9cf8e6761",
      measurementId: "G-C7YL0Q7YRQ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const SUPABASE_URL = "https://xqcbyamxiekdxytntlno.supabase.co";
    const SUPABASE_KEY = "sb_publishable_XKHXYrEw2EDdfYH17Uyx6w_k_BtGLQa";
    const SUPABASE_BUCKET = "absensi-foto";
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    const VERIFIED_ICON_URL = "https://sitenexs.com/assets/logo/verified.png";
    const SESSION_KEY = "absen_firebase_user_permanent";
    const VIEW_MODE_KEY = "absen_active_view_mode";
    const urlParams = new URLSearchParams(window.location.search);
    const requestedGroupId = (urlParams.get("groupId") || "").trim();

    let currentUser = null;
    let currentBusinessId = "";
    let currentBusinessName = "";
    let businessGroups = [];
    let activeGroupId = requestedGroupId;
    let allMessages = [];
    let adminEmpIds = new Set();
    let memberProfileMap = {}; // empId -> { username, photoURL }
    let replyData = null;
    let pendingPhoto = null;
    let toastTimer = null;
    let unsubscribeMessages = null;
    let unsubscribeBizMembers = null;

    const chatMessagesEl = document.getElementById("chatMessages");
    const chatInputEl = document.getElementById("chatInput");
    const sendMsgBtn = document.getElementById("sendMsgBtn");
    const pickPhotoBtn = document.getElementById("pickPhotoBtn");
    const chatPhotoInput = document.getElementById("chatPhotoInput");
    const groupBarEl = document.getElementById("groupBar");

    function showToast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function isAdminAccount(userObj) {
      if (!userObj) return false;
      return Boolean(userObj.isAbsenAdmin) || userObj.role === "admin_absen";
    }

    function getBackUrl() {
      if (isAdminAccount(currentUser) && localStorage.getItem(VIEW_MODE_KEY) !== "user") {
        return "../";
      }
      return "https://my.sitenexs.com/absen.html";
    }

    function getUserPhotoUrl(empId, msgData = null) {
      if (empId && memberProfileMap[empId] && memberProfileMap[empId].photoURL) {
        return memberProfileMap[empId].photoURL;
      }
      if (currentUser && empId === currentUser.id && currentUser.photoURL) {
        return currentUser.photoURL;
      }
      if (msgData && msgData.senderPhotoURL) {
        return msgData.senderPhotoURL;
      }
      return "";
    }

    function renderAvatarContent(initial, photoUrl) {
      if (photoUrl) {
        return `<img src="${escapeHtml(photoUrl)}" alt="${escapeHtml(initial)}">`;
      }
      return escapeHtml(initial);
    }

    function isAdminUser(empId, msgData = null) {
      if (empId && adminEmpIds.has(empId)) return true;
      if (msgData && (Boolean(msgData.isAbsenAdmin) || msgData.role === "admin_absen")) return true;
      if (currentUser && empId === currentUser.id && (Boolean(currentUser.isAbsenAdmin) || currentUser.role === "admin_absen")) return true;
      return false;
    }

    function getVerifiedBadgeHtml(empId, msgData = null) {
      if (!isAdminUser(empId, msgData)) return "";
      return `<img src="${VERIFIED_ICON_URL}" class="verified-badge" alt="Admin Terverifikasi" title="Admin">`;
    }

    function renderCurrentUserBadge() {
      const badgeEl = document.getElementById("currentUserBadge");
      const name = currentUser?.username || currentUser?.id || "-";
      const initial = name.charAt(0);
      const photoUrl = currentUser ? getUserPhotoUrl(currentUser.id, currentUser) : "";
      const vBadge = currentUser ? getVerifiedBadgeHtml(currentUser.id, currentUser) : "";
      badgeEl.innerHTML = `
        <span class="badge-mini-avatar">${renderAvatarContent(initial, photoUrl)}</span>
        <span>${escapeHtml(name)}</span>${vBadge}
      `;
    }

    function getTodayKey() {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
    }

    function formatTimeHHMM(isoStr) {
      if (!isoStr) return "";
      const d = new Date(isoStr);
      if (isNaN(d.getTime())) return "";
      return d.toLocaleTimeString("id-ID", {
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      }).replace(/\./g, ":");
    }

    function formatDateDivider(dateKey) {
      if (!dateKey) return "";
      if (dateKey === getTodayKey()) return "Hari Ini";
      const [y, m, d] = dateKey.split("-").map(Number);
      const dt = new Date(y, m - 1, d);
      return dt.toLocaleDateString("id-ID", {
        weekday: "short",
        day: "numeric",
        month: "short",
        year: "numeric"
      });
    }

    function setComposerEnabled(enabled, placeholderText = "Tulis pesan untuk grup bisnis...") {
      chatInputEl.disabled = !enabled;
      sendMsgBtn.disabled = !enabled;
      pickPhotoBtn.disabled = !enabled;
      chatInputEl.placeholder = placeholderText;
    }

    document.getElementById("backToAbsenBtn").addEventListener("click", (e) => {
      const dest = getBackUrl();
      if (dest === "../") {
        e.preventDefault();
        window.location.href = "../";
      } else if (window.history.length > 1 && document.referrer) {
        e.preventDefault();
        window.history.back();
      }
    });

    chatInputEl.addEventListener("input", () => {
      chatInputEl.style.height = "auto";
      chatInputEl.style.height = Math.min(chatInputEl.scrollHeight, 92) + "px";
    });

    chatInputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    pickPhotoBtn.addEventListener("click", () => {
      if (!pickPhotoBtn.disabled) chatPhotoInput.click();
    });

    function compressImage(file) {
      return new Promise((resolve, reject) => {
        if (!file.type || !file.type.startsWith("image/")) {
          reject(new Error("Bukan gambar"));
          return;
        }
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement("canvas");
            const maxWidth = 900;
            const scale = Math.min(1, maxWidth / img.width);
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            const dataUrl = canvas.toDataURL("image/jpeg", 0.8);
            canvas.toBlob((blob) => {
              if (!blob) return reject(new Error("Blob gagal"));
              resolve({ blob, dataUrl });
            }, "image/jpeg", 0.8);
          };
          img.onerror = () => reject(new Error("Gambar rusak"));
          img.src = ev.target.result;
        };
        reader.onerror = () => reject(new Error("Gagal membaca file"));
        reader.readAsDataURL(file);
      });
    }

    chatPhotoInput.addEventListener("change", async (e) => {
      const file = e.target.files && e.target.files[0];
      chatPhotoInput.value = "";
      if (!file) return;
      try {
        pendingPhoto = await compressImage(file);
        document.getElementById("photoStripThumb").src = pendingPhoto.dataUrl;
        document.getElementById("photoStrip").classList.remove("hidden");
      } catch {
        showToast("Gagal memproses gambar.");
      }
    });

    document.getElementById("cancelPhotoBtn").addEventListener("click", () => {
      pendingPhoto = null;
      document.getElementById("photoStrip").classList.add("hidden");
    });

    async function uploadChatPhoto(blob) {
      const todayKey = getTodayKey();
      const rand = Math.random().toString(36).slice(2, 6);
      const path = `chat/${currentBusinessId}/${todayKey}/${currentUser.id}_${Date.now()}_${rand}.jpg`;

      const { error } = await supabase.storage
        .from(SUPABASE_BUCKET)
        .upload(path, blob, { contentType: "image/jpeg", upsert: false });

      if (error) throw error;
      const { data } = supabase.storage.from(SUPABASE_BUCKET).getPublicUrl(path);
      return data.publicUrl;
    }

    function setReply(msg) {
      replyData = {
        id: msg.id,
        empId: msg.empId || "",
        username: msg.username,
        text: msg.text || (msg.photoUrl ? "[Foto]" : "")
      };
      document.getElementById("replyTargetName").innerHTML = `<span>Membalas ${escapeHtml(replyData.username)}</span>${getVerifiedBadgeHtml(replyData.empId)}`;
      document.getElementById("replyTargetText").textContent = replyData.text;
      document.getElementById("replyStrip").classList.remove("hidden");
      chatInputEl.focus();
    }

    function clearReply() {
      replyData = null;
      document.getElementById("replyStrip").classList.add("hidden");
    }

    document.getElementById("cancelReplyBtn").addEventListener("click", clearReply);

    function renderGroupBar() {
      if (!currentBusinessId) {
        groupBarEl.innerHTML = `<span class="group-chip">Belum terhubung ke bisnis</span>`;
        document.getElementById("activeGroupTitle").textContent = "Akses Terbatas";
        document.getElementById("businessSubLabel").textContent = "Bisnis belum ditetapkan admin";
        setComposerEnabled(false, "Bisnis belum ditetapkan admin...");
        chatMessagesEl.innerHTML = `<div class="empty-chat">Akun Anda belum terdaftar pada bisnis manapun.<br>Hubungi admin untuk mengatur bisnis Anda.</div>`;
        return;
      }

      const bizLabel = currentBusinessName ? `${currentBusinessName} (${currentBusinessId})` : currentBusinessId;
      document.getElementById("businessSubLabel").textContent = `Bisnis: ${bizLabel}`;

      if (businessGroups.length === 0) {
        activeGroupId = "";
        groupBarEl.innerHTML = `<span class="group-chip">Tidak ada grup untuk bisnis ini</span>`;
        document.getElementById("activeGroupTitle").textContent = "Belum Ada Grup";
        setComposerEnabled(false, "Belum ada grup di bisnis ini...");
        chatMessagesEl.innerHTML = `<div class="empty-chat">Belum ada grup chat untuk bisnis <b>${escapeHtml(bizLabel)}</b>.<br>Grup dari bisnis lain tidak ditampilkan.</div>`;
        return;
      }

      if (!businessGroups.some(g => g.id === activeGroupId)) {
        activeGroupId = businessGroups[0].id;
        subscribeGroupMessages(currentBusinessId, activeGroupId);
      }

      const activeGrp = businessGroups.find(g => g.id === activeGroupId);
      document.getElementById("activeGroupTitle").textContent = activeGrp ? activeGrp.name : "Grup Bisnis";
      setComposerEnabled(true, `Kirim ke ${activeGrp ? activeGrp.name : "grup"}...`);

      groupBarEl.innerHTML = businessGroups.map(g => `
        <button type="button" class="group-chip ${g.id === activeGroupId ? "active" : ""}" data-grp-id="${escapeHtml(g.id)}">
          ${escapeHtml(g.name)}
        </button>
      `).join("");

      groupBarEl.querySelectorAll("[data-grp-id]").forEach(btn => {
        btn.addEventListener("click", () => {
          const nextId = btn.dataset.grpId;
          if (nextId === activeGroupId) return;
          activeGroupId = nextId;
          clearReply();
          renderGroupBar();
          subscribeGroupMessages(currentBusinessId, activeGroupId);
        });
      });
    }

    function subscribeGroupMessages(businessId, groupId) {
      if (unsubscribeMessages) {
        unsubscribeMessages();
        unsubscribeMessages = null;
      }

      allMessages = [];
      chatMessagesEl.innerHTML = `<div class="empty-chat">Memuat pesan grup...</div>`;

      const q = query(
        collection(db, "absen_chat"),
        where("businessId", "==", businessId),
        where("groupId", "==", groupId),
        limit(120)
      );

      unsubscribeMessages = onSnapshot(q, (snapshot) => {
        const list = snapshot.docs
          .map(d => ({ id: d.id, ...d.data() }))
          .filter(m => m.businessId === businessId && m.groupId === groupId)
          .sort((a, b) => String(a.createdAt || "").localeCompare(String(b.createdAt || "")));

        allMessages = list;
        renderMessages();
      }, (err) => {
        console.error(err);
        showToast("Gagal memuat pesan grup.");
      });
    }

    function openPreviewModal(title, url) {
      if (!url) return;
      document.getElementById("imgModalSender").textContent = title;
      document.getElementById("imgModalTarget").src = url;
      document.getElementById("imgModal").classList.remove("hidden");
    }

    function renderMessages() {
      if (!currentBusinessId || !activeGroupId) return;

      if (allMessages.length === 0) {
        chatMessagesEl.innerHTML = `<div class="empty-chat">Belum ada pesan di grup ini.<br>Mulai diskusi bersama tim bisnis Anda!</div>`;
        return;
      }

      const wasAtBottom = (chatMessagesEl.scrollHeight - chatMessagesEl.scrollTop - chatMessagesEl.clientHeight) < 90;
      let lastDate = "";
      let html = "";

      allMessages.forEach((msg, idx) => {
        const msgDate = msg.date || (msg.createdAt ? msg.createdAt.slice(0, 10) : "");
        if (msgDate && msgDate !== lastDate) {
          lastDate = msgDate;
          html += `<div class="date-divider">${formatDateDivider(msgDate)}</div>`;
        }

        const isMine = currentUser && msg.empId === currentUser.id;
        const initial = (msg.username || "K").charAt(0);
        const senderPhoto = getUserPhotoUrl(msg.empId, msg);
        const timeStr = formatTimeHHMM(msg.createdAt);
        const senderVerified = getVerifiedBadgeHtml(msg.empId, msg);

        const replyHtml = msg.replyTo ? `
          <div class="reply-quote">
            <div class="reply-quote-name"><span>${escapeHtml(msg.replyTo.username)}</span>${getVerifiedBadgeHtml(msg.replyTo.empId)}</div>
            <div class="reply-quote-text">${escapeHtml(msg.replyTo.text)}</div>
          </div>
        ` : "";

        const photoHtml = msg.photoUrl
          ? `<img src="${escapeHtml(msg.photoUrl)}" class="msg-photo" data-view-img="${idx}" alt="Foto lampiran">`
          : "";

        const textHtml = msg.text
          ? `<div class="msg-text">${escapeHtml(msg.text)}</div>`
          : "";

        const deleteBtnHtml = isMine
          ? `<button type="button" class="msg-action-link" data-del-msg="${escapeHtml(msg.id)}">Hapus</button>`
          : "";

        html += `
          <div class="msg-row ${isMine ? "mine" : "other"}">
            <div class="msg-avatar" data-view-avatar="${idx}" title="Lihat foto profil ${escapeHtml(msg.username || "User")}">${renderAvatarContent(initial, senderPhoto)}</div>
            <div class="msg-bubble">
              ${!isMine ? `<div class="msg-sender"><span>${escapeHtml(msg.username)}</span>${senderVerified}</div>` : ""}
              ${replyHtml}
              ${photoHtml}
              ${textHtml}
              <div class="msg-meta">
                <button type="button" class="msg-action-link" data-reply-idx="${idx}">Balas</button>
                ${deleteBtnHtml}
                <span>${timeStr}</span>
              </div>
            </div>
          </div>
        `;
      });

      chatMessagesEl.innerHTML = html;

      chatMessagesEl.querySelectorAll("[data-view-avatar]").forEach(avEl => {
        avEl.addEventListener("click", () => {
          const m = allMessages[Number(avEl.dataset.viewAvatar)];
          if (!m) return;
          const pUrl = getUserPhotoUrl(m.empId, m);
          if (pUrl) {
            openPreviewModal(`Foto Profil • ${m.username || m.empId}`, pUrl);
          } else {
            showToast(`${m.username || "User"} belum memasang foto profil.`);
          }
        });
      });

      chatMessagesEl.querySelectorAll("[data-reply-idx]").forEach(btn => {
        btn.addEventListener("click", () => {
          const m = allMessages[Number(btn.dataset.replyIdx)];
          if (m) setReply(m);
        });
      });

      chatMessagesEl.querySelectorAll("[data-del-msg]").forEach(btn => {
        btn.addEventListener("click", async () => {
          const id = btn.dataset.delMsg;
          try {
            await deleteDoc(doc(db, "absen_chat", id));
            showToast("Pesan dihapus.");
          } catch {
            showToast("Gagal menghapus pesan.");
          }
        });
      });

      chatMessagesEl.querySelectorAll("[data-view-img]").forEach(img => {
        img.addEventListener("click", () => {
          const m = allMessages[Number(img.dataset.viewImg)];
          if (!m || !m.photoUrl) return;
          openPreviewModal(`${m.username} • ${formatTimeHHMM(m.createdAt)}`, m.photoUrl);
        });
      });

      if (wasAtBottom || allMessages.length <= 15) {
        chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
      }
    }

    document.getElementById("closeImgModalBtn").addEventListener("click", () => {
      document.getElementById("imgModal").classList.add("hidden");
    });

    async function sendMessage() {
      if (!currentUser || !currentBusinessId || !activeGroupId) {
        showToast("Pilih grup bisnis yang aktif terlebih dahulu.");
        return;
      }

      const text = chatInputEl.value.trim();
      if (!text && !pendingPhoto) return;

      sendMsgBtn.disabled = true;

      try {
        let photoUrl = "";
        if (pendingPhoto) {
          photoUrl = await uploadChatPhoto(pendingPhoto.blob);
        }

        const nowIso = new Date().toISOString();
        const msgId = `${Date.now()}_${currentUser.id}`;
        const myPhoto = getUserPhotoUrl(currentUser.id, currentUser);

        await setDoc(doc(db, "absen_chat", msgId), {
          businessId: currentBusinessId,
          groupId: activeGroupId,
          empId: currentUser.id,
          username: currentUser.username,
          senderPhotoURL: myPhoto,
          isAbsenAdmin: isAdminUser(currentUser.id, currentUser),
          text,
          photoUrl,
          replyTo: replyData ? { ...replyData } : null,
          date: getTodayKey(),
          createdAt: nowIso
        });

        chatInputEl.value = "";
        chatInputEl.style.height = "auto";
        pendingPhoto = null;
        document.getElementById("photoStrip").classList.add("hidden");
        clearReply();
        chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
      } catch (err) {
        console.error(err);
        showToast("Gagal mengirim pesan.");
      } finally {
        sendMsgBtn.disabled = false;
      }
    }

    sendMsgBtn.addEventListener("click", sendMessage);

    (function init() {
      try {
        const saved = JSON.parse(localStorage.getItem(SESSION_KEY));
        if (saved && saved.id && saved.username) {
          currentUser = saved;
          renderCurrentUserBadge();
        } else {
          showToast("Sesi tidak ditemukan. Login di halaman utama.");
          setTimeout(() => {
            window.location.href = "https://my.sitenexs.com/absen.html";
          }, 1200);
          return;
        }
      } catch {
        window.location.href = "https://my.sitenexs.com/absen.html";
        return;
      }

      let activeGroupSub = null;

      onSnapshot(doc(db, "absen_karyawan", currentUser.id), (snap) => {
        if (!snap.exists()) {
          localStorage.removeItem(SESSION_KEY);
          window.location.href = "https://my.sitenexs.com/absen.html";
          return;
        }

        const userDoc = snap.data();
        currentUser = { ...currentUser, ...userDoc };
        renderCurrentUserBadge();

        const nextBizId = (userDoc.businessId || "").trim().toUpperCase();
        if (nextBizId !== currentBusinessId) {
          currentBusinessId = nextBizId;
          currentBusinessName = "";
          activeGroupId = requestedGroupId;
          adminEmpIds = new Set();
          memberProfileMap = {};

          if (unsubscribeMessages) {
            unsubscribeMessages();
            unsubscribeMessages = null;
          }
          if (unsubscribeBizMembers) {
            unsubscribeBizMembers();
            unsubscribeBizMembers = null;
          }

          if (currentBusinessId) {
            onSnapshot(doc(db, "absen_bisnis", currentBusinessId), (bizSnap) => {
              currentBusinessName = bizSnap.exists() ? (bizSnap.data().name || "") : "";
              renderGroupBar();
            });

            // Muat foto profil & status admin seluruh anggota di bisnis yang sama
            const qMembers = query(collection(db, "absen_karyawan"), where("businessId", "==", currentBusinessId));
            unsubscribeBizMembers = onSnapshot(qMembers, (mSnap) => {
              const nextAdmins = new Set();
              const nextProfiles = {};
              mSnap.docs.forEach(d => {
                const u = d.data();
                const uId = u.id || d.id;
                nextProfiles[uId] = {
                  username: u.username || uId,
                  photoURL: u.photoURL || ""
                };
                if (Boolean(u.isAbsenAdmin) || u.role === "admin_absen") {
                  nextAdmins.add(uId);
                }
              });
              adminEmpIds = nextAdmins;
              memberProfileMap = nextProfiles;
              renderCurrentUserBadge();
              renderMessages();
            });

            if (activeGroupSub) activeGroupSub();
            const qGrp = query(collection(db, "absen_grup"), where("businessId", "==", currentBusinessId));
            activeGroupSub = onSnapshot(qGrp, (gSnap) => {
              businessGroups = gSnap.docs
                .map(d => ({ id: d.id, ...d.data() }))
                .filter(g => g.businessId === currentBusinessId)
                .sort((a, b) => String(a.createdAt || "").localeCompare(String(b.createdAt || "")));
              renderGroupBar();
            });
          } else {
            if (activeGroupSub) {
              activeGroupSub();
              activeGroupSub = null;
            }
            businessGroups = [];
            renderGroupBar();
          }
        } else {
          renderMessages();
        }
      });
    })();
  </script>
</body>
</html>
