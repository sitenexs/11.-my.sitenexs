<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kalender &amp; Riwayat - Absensi Karyawan</title>
  <style>
    :root {
      --bg: #f3f6f8;
      --surface: #ffffff;
      --surface-soft: #f8fafc;
      --text: #0f172a;
      --text-secondary: #475569;
      --muted: #64748b;
      --border: rgba(203, 213, 225, 0.72);
      --primary: #0f766e;
      --primary-dark: #115e59;
      --primary-light: #14b8a6;
      --primary-bg: #f0fdfa;
      --success: #059669;
      --success-bg: #d1fae5;
      --danger: #e11d48;
      --danger-bg: #ffe4e6;
      --warning: #d97706;
      --warning-bg: #fef3c7;
      --admin-accent: #1d4ed8;
      --admin-dark: #1e3a8a;
      --admin-bg: #eff6ff;
      --radius: 18px;
      --radius-sm: 12px;
      --clay-shadow: 0 8px 22px -4px rgba(15, 23, 42, 0.055), 0 2px 6px -1px rgba(15, 23, 42, 0.03), inset 0 1px 1px rgba(255, 255, 255, 0.95);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.45;
      font-size: 13px;
      -webkit-text-size-adjust: 100%;
    }

    @keyframes tabFadeSlide {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes calSlideNext {
      from { opacity: 0; transform: translateX(14px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes calSlidePrev {
      from { opacity: 0; transform: translateX(-14px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes modalPop {
      from { opacity: 0; transform: scale(0.94); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes itemEnter {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .cal-anim-next { animation: calSlideNext 0.24s cubic-bezier(0.22, 1, 0.36, 1); }
    .cal-anim-prev { animation: calSlidePrev 0.24s cubic-bezier(0.22, 1, 0.36, 1); }

    .app-container {
      width: 100%;
      max-width: 440px;
      min-height: 100vh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      padding-top: 54px;
      padding-bottom: 76px;
    }

    .app-container.is-admin-mode {
      --primary: #1d4ed8;
      --primary-dark: #1e3a8a;
      --primary-light: #3b82f6;
      --primary-bg: #eff6ff;
    }

    /* Fixed Topbar */
    .topbar {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 440px;
      z-index: 50;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      padding: 9px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .app-container.is-admin-mode .topbar {
      background: rgba(248, 250, 252, 0.94);
      border-bottom-color: rgba(147, 197, 253, 0.7);
    }

    .topbar-user {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }

    .avatar-wrap {
      position: relative;
      flex-shrink: 0;
    }

    .avatar {
      width: 35px;
      height: 35px;
      border-radius: 12px;
      background: linear-gradient(135deg, #ccfbf1, #99f6e4);
      color: var(--primary-dark);
      font-size: 14px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      text-transform: uppercase;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8);
    }

    .app-container.is-admin-mode .avatar {
      background: linear-gradient(135deg, #1e3a8a, #2563eb);
      color: #ffffff;
    }

    .avatar-dot {
      position: absolute;
      bottom: -1px;
      right: -1px;
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: var(--success);
      border: 2px solid #ffffff;
    }

    .topbar-info {
      min-width: 0;
      flex: 1;
    }

    .user-name-row {
      display: flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
    }

    .user-name {
      font-size: 13.5px;
      font-weight: 800;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.2;
      letter-spacing: -0.2px;
    }

    .admin-role-pill {
      display: inline-flex;
      align-items: center;
      padding: 1.5px 7px;
      border-radius: 999px;
      background: linear-gradient(135deg, #1e3a8a, #2563eb);
      color: #ffffff;
      font-size: 9.5px;
      font-weight: 800;
      flex-shrink: 0;
    }

    .user-id {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn-logout {
      flex-shrink: 0;
      border: 1px solid #fecdd3;
      background: var(--danger-bg);
      color: var(--danger);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .content-area {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      animation: tabFadeSlide 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .admin-mode-bar {
      background: linear-gradient(145deg, #0f172a 0%, #1e3a8a 60%, #1d4ed8 100%);
      color: #ffffff;
      border-radius: 16px;
      padding: 11px 13px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 8px 20px -4px rgba(30, 58, 138, 0.28);
    }

    .admin-mode-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .admin-mode-title {
      font-size: 13px;
      font-weight: 800;
    }

    .admin-mode-sub {
      font-size: 10.5px;
      color: #bfdbfe;
      font-weight: 600;
    }

    .card {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      box-shadow: var(--clay-shadow);
    }

    .card-title {
      font-size: 13.5px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.2px;
      margin-bottom: 11px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-wrap: wrap;
    }

    .form-select {
      width: 100%;
      max-width: 100%;
      padding: 9px 11px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 11px;
      font-size: 12.5px;
      font-weight: 700;
      font-family: inherit;
      color: var(--text);
      background: #ffffff;
      outline: none;
    }

    /* ================= CALENDAR ================= */
    .cal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 11px;
    }

    .cal-month-label {
      font-size: 14px;
      font-weight: 800;
      text-align: center;
      flex: 1;
      min-width: 0;
    }

    .cal-nav-btn {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
      border: 1px solid var(--border);
      background: var(--surface-soft);
      color: var(--text);
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 5px;
      width: 100%;
    }

    .cal-dow {
      text-align: center;
      font-size: 10px;
      font-weight: 800;
      color: var(--muted);
      padding-bottom: 4px;
      text-transform: uppercase;
    }

    .cal-dow.sun { color: var(--danger); }

    .cal-cell {
      aspect-ratio: 1 / 1;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--surface-soft);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      cursor: pointer;
      min-width: 0;
      transition: transform 0.12s, border-color 0.15s, background-color 0.15s;
    }

    .cal-cell:active:not(.empty) { transform: scale(0.93); }
    .cal-cell.empty { border: none; background: transparent; cursor: default; }
    .cal-cell.has-record { background: #ffffff; border-color: #cbd5e1; }
    .cal-cell.has-target { border-color: rgba(29, 78, 216, 0.45); }
    .cal-cell.sunday { background: #fff8f9; }
    .cal-cell.holiday { background: #fff1f2; border-color: #fecdd3; }
    .cal-cell.today { border-color: var(--primary); background: var(--primary-bg); }
    .cal-cell.selected {
      background: var(--primary);
      border-color: var(--primary);
      box-shadow: 0 3px 10px rgba(29, 78, 216, 0.25);
    }

    .cal-num {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text);
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    .cal-dots-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      min-height: 4px;
    }

    .cal-dot {
      width: 4px;
      height: 4px;
      border-radius: 999px;
      background: transparent;
    }

    .cal-dot.full { background: var(--success); }
    .cal-dot.partial { background: var(--warning); }
    .cal-dot.target-mark { background: #2563eb; }
    .cal-cell.selected .cal-dot.full,
    .cal-cell.selected .cal-dot.partial,
    .cal-cell.selected .cal-dot.target-mark { background: #ffffff; }

    .cal-cell.sunday .cal-num,
    .cal-cell.holiday .cal-num { color: var(--danger); }
    .cal-cell.today .cal-num { color: var(--primary); font-weight: 800; }
    .cal-cell.selected .cal-num { color: #ffffff; font-weight: 800; }

    .cal-legend {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 9px;
      font-size: 10px;
      font-weight: 700;
      color: var(--muted);
    }

    .cal-legend-item {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .cal-holidays-box {
      margin-top: 11px;
      padding-top: 9px;
      border-top: 1px dashed var(--border);
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .cal-holiday-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-secondary);
      padding: 5px 8px;
      border-radius: 8px;
      background: #fff1f2;
      cursor: pointer;
    }

    .cal-holiday-date {
      font-weight: 800;
      color: var(--danger);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .cal-holiday-name {
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ================= TARGET DI TANGGAL TERPILIH ================= */
    .target-date-box {
      background: var(--primary-bg);
      border: 1px solid rgba(29, 78, 216, 0.22);
      border-radius: 12px;
      padding: 9px 11px;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .target-date-head {
      font-size: 11px;
      font-weight: 800;
      color: var(--primary);
    }

    .target-date-chip {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 7px 9px;
      font-size: 11.5px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    /* ================= FILTER & HISTORY ================= */
    .filter-row {
      display: flex;
      gap: 7px;
      margin-bottom: 11px;
      align-items: stretch;
    }

    .custom-picker-box {
      position: relative;
      display: flex;
      align-items: center;
      gap: 7px;
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 8px 10px;
      min-height: 38px;
      cursor: pointer;
    }

    .custom-picker-box svg {
      width: 15px;
      height: 15px;
      color: var(--primary);
      flex-shrink: 0;
    }

    .custom-picker-text {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .custom-picker-text.placeholder {
      color: var(--muted);
      font-weight: 500;
    }

    .native-overlay-input {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
      border: none;
    }

    .btn-outline-sm {
      flex-shrink: 0;
      background: var(--surface-soft);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 13px;
      border-radius: 11px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-keluar {
      background: linear-gradient(135deg, #e11d48, #f43f5e);
      color: #ffffff;
      border: none;
      border-radius: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .history-item {
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 11px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      animation: itemEnter 0.22s ease;
    }

    .history-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-wrap: wrap;
    }

    .history-date {
      font-size: 12px;
      font-weight: 800;
      color: var(--text);
    }

    .history-badges {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }

    .time-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3.5px 8px;
      border-radius: 7px;
      font-size: 11px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      border: none;
      cursor: pointer;
    }

    .time-chip.in { background: var(--success-bg); color: var(--success); }
    .time-chip.out { background: var(--danger-bg); color: var(--danger); }
    .time-chip.late { background: var(--warning-bg); color: var(--warning); }
    .time-chip.empty { background: #e2e8f0; color: var(--muted); cursor: default; }

    .chip-cam {
      font-size: 9.5px;
      opacity: 0.9;
      text-decoration: underline;
    }

    .chip-late-pill {
      font-size: 9px;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 4px;
      background: rgba(217, 119, 6, 0.16);
      color: #b45309;
      text-transform: uppercase;
    }

    .history-note-box {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 10px;
    }

    .history-note-text {
      font-size: 12px;
      color: var(--text);
      white-space: pre-line;
      word-wrap: break-word;
      overflow-wrap: anywhere;
      line-height: 1.45;
    }

    .photo-thumbs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 7px;
      padding-top: 7px;
      border-top: 1px dashed var(--border);
    }

    .photo-thumb-btn {
      display: block;
      width: 46px;
      height: 46px;
      border-radius: 9px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--surface-soft);
      padding: 0;
      cursor: pointer;
      flex-shrink: 0;
    }

    .photo-thumb-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .badge {
      display: inline-block;
      padding: 3.5px 9px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 800;
      white-space: nowrap;
    }

    .badge-ok { background: var(--primary-bg); color: var(--primary); }
    .badge-success { background: var(--success-bg); color: var(--success); }

    .empty-state {
      text-align: center;
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      padding: 20px 10px;
      background: var(--surface-soft);
      border-radius: 12px;
      border: 1px dashed #cbd5e1;
    }

    /* ================= FIXED BOTTOM NAVIGATION ================= */
    .bottom-nav {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: 100%;
      max-width: 440px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 6px 10px calc(7px + env(safe-area-inset-bottom, 0px));
      z-index: 60;
      touch-action: none;
    }

    .nav-btn {
      position: relative;
      border: none;
      background: transparent;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 4px;
      font-size: 10.5px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }

    .nav-icon-pill {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 26px;
      border-radius: 999px;
    }

    .nav-btn svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.1;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .nav-btn.active {
      color: var(--primary);
    }

    .nav-btn.active .nav-icon-pill {
      background: #ccfbf1;
    }

    .nav-badge {
      position: absolute;
      top: 2px;
      right: 25%;
      min-width: 15px;
      height: 15px;
      padding: 0 4px;
      border-radius: 999px;
      background: var(--warning);
      color: #ffffff;
      font-size: 9px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1.5px solid #ffffff;
    }

    /* ================= FLOATING CHAT BUTTON ================= */
    .fab-chat-wrap {
      position: fixed;
      left: 50%;
      bottom: calc(74px + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%);
      width: 100%;
      max-width: 440px;
      pointer-events: none;
      z-index: 58;
      display: flex;
      justify-content: flex-end;
      padding: 0 14px;
    }

    .fab-chat-btn {
      pointer-events: auto;
      width: 50px;
      height: 50px;
      border-radius: 999px;
      background: linear-gradient(135deg, #0f766e, #14b8a6);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      box-shadow: 0 8px 20px rgba(15, 118, 110, 0.34), inset 0 1px 1px rgba(255, 255, 255, 0.35);
      border: 2px solid rgba(255, 255, 255, 0.85);
    }

    /* ================= PHOTO GALLERY LIGHTBOX MODAL ================= */
    .lightbox-modal {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.96);
      z-index: 250;
      display: flex;
      flex-direction: column;
      max-width: 440px;
      margin: 0 auto;
      color: #ffffff;
      animation: tabFadeSlide 0.2s ease;
    }

    .lb-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 12px 14px;
      background: rgba(15, 23, 42, 0.9);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .lb-info { min-width: 0; }
    .lb-title { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .lb-counter { font-size: 11px; color: #94a3b8; }

    .cam-close-btn {
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      padding: 5px 11px;
      border-radius: 9px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
    }

    .lb-stage {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 12px;
    }

    .lb-main-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      animation: modalPop 0.2s ease;
    }

    .lb-nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 36px;
      height: 36px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(15, 23, 42, 0.72);
      color: #ffffff;

    function getImportantDayInfo(dateKey) {
      if (SPECIFIC_HOLIDAYS[dateKey]) return SPECIFIC_HOLIDAYS[dateKey];
      const mmdd = dateKey.slice(5);
      if (FIXED_HOLIDAYS[mmdd]) return FIXED_HOLIDAYS[mmdd];
      return null;

    function showToast(msg) {
      const el = document.getElementById("toast");
      el.className = "toast info";
      document.getElementById("toastIcon").innerHTML = `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>`;
      document.getElementById("toastText").textContent = msg;
      el.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove("show"), 3000);
    }

    function showCustomConfirm(title, message, okLabel = "Ya, Lanjut") {
      return new Promise((resolve) => {
        const overlay = document.getElementById("confirmOverlay");
        document.getElementById("confirmTitle").textContent = title;
        document.getElementById("confirmMsg").textContent = message;
        const okBtn = document.getElementById("confirmOkBtn");
        const cancelBtn = document.getElementById("confirmCancelBtn");
        okBtn.textContent = okLabel;
        overlay.classList.remove("hidden");

        const cleanup = (res) => {
          overlay.classList.add("hidden");
          okBtn.onclick = null;
          cancelBtn.onclick = null;
          resolve(res);
        };

        okBtn.onclick = () => cleanup(true);
        cancelBtn.onclick = () => cleanup(false);
      });
    }

    function getTodayKey() {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
    }

    function formatShortDateKey(dateKey) {
      if (!dateKey) return "-";
      const [y, m, d] = dateKey.split("-").map(Number);
      const dt = new Date(y, m - 1, d);
      return dt.toLocaleDateString("id-ID", {
        weekday: "short",
        day: "numeric",
        month: "short",
        year: "numeric"
      });
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function cleanNoteLines(rawNote) {
      return String(rawNote || "")
        .split("\n")
        .map(line => line.trim())
        .filter(Boolean)
        .join("\n");
    }

    function isUserAdmin(userObj) {
      if (!userObj) return false;
      return Boolean(userObj.isAbsenAdmin) || userObj.role === "admin_absen";
    }

    function isAdminModeActive() {
      return isUserAdmin(currentUser) && activeMode === "admin";
    }

    function getActiveRecordsScope() {
      if (!isAdminModeActive()) return myRecords;
      const empIdSet = new Set(businessEmployees.map(e => e.id || e.docId));
      const pickedEmp = adminEmpSelectEl.value || "ALL";
      return businessAllRecords.filter(r => {
        if (!r.empId || !empIdSet.has(r.empId)) return false;
        if (pickedEmp !== "ALL" && r.empId !== pickedEmp) return false;
        return true;
      });
    }

    function getActiveTargetsScope() {
      if (!isAdminModeActive()) return myTargets;
      const empIdSet = new Set(businessEmployees.map(e => e.id || e.docId));
      const pickedEmp = adminEmpSelectEl.value || "ALL";
      return businessAllTargets.filter(t => {
        if (!t.empId || !empIdSet.has(t.empId)) return false;
        if (pickedEmp !== "ALL" && t.empId !== pickedEmp) return false;
        return true;
      });
    }

    function refreshAdminEmpDropdown() {
      const prev = adminEmpSelectEl.value || "ALL";
      const opts = [`<option value="ALL">Semua Karyawan Bisnis Ini (${businessEmployees.length})</option>`].concat(
        businessEmployees.map(e => {
          const idVal = e.id || e.docId;
          return `<option value="${escapeHtml(idVal)}">${escapeHtml(e.username || idVal)} (${escapeHtml(idVal)})</option>`;
        })
      );
      adminEmpSelectEl.innerHTML = opts.join("");
      adminEmpSelectEl.value = Array.from(adminEmpSelectEl.options).some(o => o.value === prev) ? prev : "ALL";
      document.getElementById("adminEmpCountBadge").textContent = `${businessEmployees.length} Karyawan`;
    }

    function startAdminBusinessListeners(bizId) {
      if (bizId === activeBizId && unsubBizEmp && unsubBizRec && unsubBizRem) return;
      if (unsubBizEmp) { unsubBizEmp(); unsubBizEmp = null; }
      if (unsubBizRec) { unsubBizRec(); unsubBizRec = null; }
      if (unsubBizRem) { unsubBizRem(); unsubBizRem = null; }

      activeBizId = bizId || "";
      businessEmployees = [];
      businessAllRecords = [];
      businessAllTargets = [];

      if (!activeBizId) {
        refreshAdminEmpDropdown();
        renderCalendar();
        renderHistory();
        return;
      }

      const qEmp = query(collection(db, "absen_karyawan"), where("businessId", "==", activeBizId));
      unsubBizEmp = onSnapshot(qEmp, (snap) => {
        businessEmployees = snap.docs.map(d => ({ docId: d.id, ...d.data() }));
        refreshAdminEmpDropdown();
        renderCalendar();
        renderHistory();
      });

      unsubBizRec = onSnapshot(collection(db, "absen_riwayat"), (snap) => {
        businessAllRecords = snap.docs.map(d => d.data());
        renderCalendar();
        renderHistory();
      });

      const qRem = query(collection(db, "absen_pengingat"), where("businessId", "==", activeBizId));
      unsubBizRem = onSnapshot(qRem, (snap) => {
        businessAllTargets = snap.docs.map(d => ({ docId: d.id, ...d.data() }));
        renderCalendar();
        renderHistory();
      });
    }

    function syncModeFromIndex() {
      const canUseAdmin = isUserAdmin(currentUser);
      if (!canUseAdmin) {
        activeMode = "user";
      } else {
        const storedMode = localStorage.getItem(VIEW_MODE_KEY);
        activeMode = (storedMode === "user") ? "user" : "admin";
      }

      const isAdminView = isAdminModeActive();
      document.getElementById("appContainer").classList.toggle("is-admin-mode", isAdminView);
      document.getElementById("adminRoleBadge").classList.toggle("hidden", !isAdminView);
      document.getElementById("adminModeBar").classList.toggle("hidden", !isAdminView);

      if (isAdminView) {
        const bizId = (currentUser?.businessId || "").trim().toUpperCase();
        document.getElementById("adminBizSub").textContent = bizId ? `Bisnis: ${bizId}` : "Bisnis belum diatur";
        startAdminBusinessListeners(bizId);
      }

      renderCalendar();
      renderHistory();
    }

    adminEmpSelectEl.addEventListener("change", () => {
      renderCalendar();
      renderHistory();
    });

    window.addEventListener("storage", (e) => {
      if (e.key === VIEW_MODE_KEY && currentUser) {
        syncModeFromIndex();
      }

    window.addEventListener("pageshow", () => {
      if (currentUser) {
        syncModeFromIndex();

        filterDateDisplay.classList.remove("placeholder");
      } else {
        filterDateDisplay.textContent = "Semua tanggal";
        filterDateDisplay.classList.add("placeholder");
      }
    }

    // Logout
    document.getElementById("logoutBtn").addEventListener("click", async () => {
      if (!currentUser) return;
      const ok = await showCustomConfirm(
        "Keluar Akun",
        `Keluar dari sesi ${currentUser.username} (${currentUser.id})?`,
        "Keluar"
      );
      if (!ok) return;
      localStorage.removeItem(SESSION_KEY);
      localStorage.removeItem(VIEW_MODE_KEY);
      window.location.href = "https://my.sitenexs.com/absen";
    });

    // ================= LIGHTBOX GALLERY =================
    function openPhotoGallery(photosList, startIndex = 0, title = "Galeri Foto") {
      if (!Array.isArray(photosList) || photosList.length === 0) return;
      lightboxPhotos = photosList;
      lightboxIndex = Math.max(0, Math.min(startIndex, photosList.length - 1));
      document.getElementById("lbTitle").textContent = title;
      renderLightboxSlide();
      document.getElementById("lightboxModal").classList.remove("hidden");
    }

    function renderLightboxSlide() {
      const total = lightboxPhotos.length;
      const item = lightboxPhotos[lightboxIndex];
      const mainImg = document.getElementById("lbMainImg");
      mainImg.style.animation = "none";
      void mainImg.offsetWidth;
      mainImg.style.animation = "";
      mainImg.src = item.url;
      document.getElementById("lbCounter").textContent = `${lightboxIndex + 1} / ${total} • ${item.label || "Foto"}`;

      document.getElementById("lbPrevBtn").classList.toggle("hidden", total <= 1);
      document.getElementById("lbNextBtn").classList.toggle("hidden", total <= 1);

      const thumbsBar = document.getElementById("lbThumbsBar");
      thumbsBar.innerHTML = lightboxPhotos.map((p, idx) => `
        <button type="button" class="lb-thumb ${idx === lightboxIndex ? "active" : ""}" data-lb-idx="${idx}">
          <img src="${escapeHtml(p.url)}" alt="${escapeHtml(p.label || "Foto")}">
        </button>
      `).join("");

      thumbsBar.querySelectorAll("[data-lb-idx]").forEach(btn => {
        btn.addEventListener("click", () => {
          lightboxIndex = Number(btn.dataset.lbIdx);
          renderLightboxSlide();
        });
      });
    }

    document.getElementById("lbCloseBtn").addEventListener("click", () => {
      document.getElementById("lightboxModal").classList.add("hidden");
      lightboxPhotos = [];
    });

    document.getElementById("lbPrevBtn").addEventListener("click", () => {
      if (lightboxPhotos.length <= 1) return;
      lightboxIndex = (lightboxIndex - 1 + lightboxPhotos.length) % lightboxPhotos.length;
      renderLightboxSlide();
    });

    document.getElementById("lbNextBtn").addEventListener("click", () => {
      if (lightboxPhotos.length <= 1) return;
      lightboxIndex = (lightboxIndex + 1) % lightboxPhotos.length;
      renderLightboxSlide();
    });

    let touchStartX = 0;
    const lbStage = document.getElementById("lbStage");
    lbStage.addEventListener("touchstart", (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });
    lbStage.addEventListener("touchend", (e) => {
      const diff = e.changedTouches[0].screenX - touchStartX;
      if (Math.abs(diff) > 40 && lightboxPhotos.length > 1) {
        if (diff < 0) {
          lightboxIndex = (lightboxIndex + 1) % lightboxPhotos.length;
        } else {
          lightboxIndex = (lightboxIndex - 1 + lightboxPhotos.length) % lightboxPhotos.length;
        }
        renderLightboxSlide();
      }
    }, { passive: true });

    function collectRecordPhotos(rec) {
      const list = [];
      if (rec.checkInPhoto) {
        const lateTxt = rec.checkInLate ? " - Telat" : "";
        list.push({ url: rec.checkInPhoto, label: `Masuk (${rec.checkIn ? rec.checkIn.slice(0, 5) : "-"}${lateTxt})` });
      }
      if (rec.checkOutPhoto) {
        const lateTxt = rec.checkOutLate ? " - Telat" : "";
        list.push({ url: rec.checkOutPhoto, label: `Keluar (${rec.checkOut ? rec.checkOut.slice(0, 5) : "-"}${lateTxt})` });
      }
      const notePhotos = Array.isArray(rec.notePhotos) ? rec.notePhotos : [];
      notePhotos.forEach((u, i) => {
        list.push({ url: u, label: `Dokumentasi #${i + 1}` });
      });
      return list;
    }

    // ================= RENDER CALENDAR & HISTORY =================
    function renderCalendar(animDir = "") {
      const grid = document.getElementById("calendarGrid");
      const label = document.getElementById("calMonthLabel");
      const holidaysBox = document.getElementById("calHolidaysBox");
      const monthDate = new Date(calYear, calMonth, 1);

      label.textContent = monthDate.toLocaleDateString("id-ID", {
        month: "long",
        year: "numeric"
      });

      const firstDayIndex = monthDate.getDay();
      const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
      const todayKey = getTodayKey();
      const selectedDate = filterDateInput.value;

      const scopedRecords = getActiveRecordsScope();
      const scopedTargets = getActiveTargetsScope();

      const recordMap = {};
      scopedRecords.forEach(r => {
        if (!r.date) return;
        if (!recordMap[r.date]) recordMap[r.date] = [];
        recordMap[r.date].push(r);
      });

      const targetDateSet = new Set();
      scopedTargets.forEach(t => {
        if (t.date && (t.category === "Target" || Number(t.targetGoal) > 0 || !t.category)) {
          targetDateSet.add(t.date);
        }
      });

      const dows = [
        { name: "Min", isSun: true },
        { name: "Sen", isSun: false },
        { name: "Sel", isSun: false },
        { name: "Rab", isSun: false },
        { name: "Kam", isSun: false },
        { name: "Jum", isSun: false },
        { name: "Sab", isSun: false }
      ];

      let html = dows.map(d => `<div class="cal-dow ${d.isSun ? "sun" : ""}">${d.name}</div>`).join("");

      for (let i = 0; i < firstDayIndex; i++) {
        html += `<div class="cal-cell empty"></div>`;
      }

      const monthImportantDays = [];

      for (let day = 1; day <= daysInMonth; day++) {
        const mStr = String(calMonth + 1).padStart(2, "0");
        const dStr = String(day).padStart(2, "0");
        const dateKey = `${calYear}-${mStr}-${dStr}`;
        const dayRecs = recordMap[dateKey] || [];
        const hasTargetMark = targetDateSet.has(dateKey);
        const dowIndex = (firstDayIndex + day - 1) % 7;
        const isSunday = dowIndex === 0;
        const importantInfo = getImportantDayInfo(dateKey);

        if (importantInfo) {
          monthImportantDays.push({ day, dateKey, ...importantInfo });
        }

        const classes = ["cal-cell"];
        if (dayRecs.length > 0) classes.push("has-record");
        if (hasTargetMark) classes.push("has-target");
        if (isSunday) classes.push("sunday");
        if (importantInfo && importantInfo.isHoliday) classes.push("holiday");
        if (dateKey === todayKey) classes.push("today");
        if (dateKey === selectedDate) classes.push("selected");

        let recDotClass = "";
        if (dayRecs.length > 0) {
          const allFull = dayRecs.every(r => r.checkIn && r.checkOut);
          recDotClass = allFull ? "full" : "partial";
        }

        html += `
          <div class="${classes.join(" ")}" data-cal-date="${dateKey}" ${importantInfo ? `title="${escapeHtml(importantInfo.name)}"` : ""}>
            <span class="cal-num">${day}</span>
            <div class="cal-dots-row">
              ${recDotClass ? `<span class="cal-dot ${recDotClass}"></span>` : ""}
              ${hasTargetMark ? `<span class="cal-dot target-mark"></span>` : ""}
            </div>
          </div>
        `;
      }

      grid.classList.remove("cal-anim-next", "cal-anim-prev");
      if (animDir) {
        void grid.offsetWidth;
        grid.classList.add(animDir === "next" ? "cal-anim-next" : "cal-anim-prev");
      }
      grid.innerHTML = html;

      if (monthImportantDays.length > 0) {
        holidaysBox.classList.remove("hidden");
        holidaysBox.innerHTML = monthImportantDays.map(item => `
          <div class="cal-holiday-item" data-hol-date="${item.dateKey}">
            <span class="cal-holiday-date">${item.day} ${monthDate.toLocaleDateString("id-ID", { month: "short" })}</span>
            <span class="cal-holiday-name">• ${escapeHtml(item.name)}</span>
          </div>
        `).join("");

        holidaysBox.querySelectorAll("[data-hol-date]").forEach(el => {
          el.addEventListener("click", () => {
            const picked = el.dataset.holDate;
            filterDateInput.value = picked;
            updateFilterDateDisplay();
            renderCalendar();
            renderHistory();
            document.getElementById("riwayatSectionCard").scrollIntoView({ behavior: "smooth", block: "nearest" });
          });
        });
      } else {
        holidaysBox.classList.add("hidden");
        holidaysBox.innerHTML = "";
      }

      grid.querySelectorAll("[data-cal-date]").forEach(cell => {
        cell.addEventListener("click", () => {
          const picked = cell.dataset.calDate;
          if (filterDateInput.value === picked) {
            filterDateInput.value = "";
          } else {
            filterDateInput.value = picked;
            const info = getImportantDayInfo(picked);
            if (info) {
              showToast(`${formatShortDateKey(picked)}: ${info.name}`);
            }
          }
          updateFilterDateDisplay();
          renderCalendar();
          renderHistory();
          document.getElementById("riwayatSectionCard").scrollIntoView({ behavior: "smooth", block: "nearest" });
        });
      });
    }

    function renderSelectedDateTargets(filterVal) {
      const box = document.getElementById("selectedDateTargetsBox");
      const scopedTargets = getActiveTargetsScope();

      if (!filterVal) {
        box.classList.add("hidden");
        box.innerHTML = "";
        return;
      }

      const dayTargets = scopedTargets.filter(t => t.date === filterVal);
      if (dayTargets.length === 0) {
        box.classList.add("hidden");
        box.innerHTML = "";
        return;
      }

      const empNameMap = {};
      businessEmployees.forEach(e => {
        const idVal = e.id || e.docId;
        empNameMap[idVal] = e.username || idVal;
      });

      box.classList.remove("hidden");
      box.innerHTML = `
        <div class="target-date-head">Target User pada ${escapeHtml(formatShortDateKey(filterVal))} (${dayTargets.length})</div>
        ${dayTargets.map(t => {
          const goal = Number(t.targetGoal) || 0;
          const cur = Number(t.targetCurrent) || 0;
          const goalTxt = goal > 0 ? `${cur}/${goal} ${escapeHtml(t.targetUnit || "")}` : (t.category || "Target");
          const whoTxt = isAdminModeActive() ? ` • ${escapeHtml(empNameMap[t.empId] || t.username || t.empId)}` : "";
          return `
            <div class="target-date-chip">
              <div>
                <b>${escapeHtml(t.title || "-")}</b>
                <div style="font-size:10.5px; color:var(--muted);">${escapeHtml(goalTxt)}${whoTxt}</div>
              </div>
              <span class="badge ${t.completed ? "badge-success" : "badge-ok"}">${t.completed ? "Selesai" : "Aktif"}</span>
            </div>
          `;
        }).join("")}
      `;
    }

    function renderHistory() {
      const container = document.getElementById("historyList");
      const countLabel = document.getElementById("historyCountLabel");
      const filterVal = filterDateInput.value;

      renderSelectedDateTargets(filterVal);

      const empNameMap = {};
      businessEmployees.forEach(e => {
        const idVal = e.id || e.docId;
        empNameMap[idVal] = e.username || idVal;
      });

      let sorted = [...getActiveRecordsScope()].sort((a, b) => {
        const dateCmp = String(b.date || "").localeCompare(String(a.date || ""));
        if (dateCmp !== 0) return dateCmp;
        return String(a.empId || "").localeCompare(String(b.empId || ""));
      });

      if (filterVal) {
        sorted = sorted.filter(r => r.date === filterVal);
      }

      countLabel.textContent = `${sorted.length} Data`;

      if (sorted.length === 0) {
        const msg = filterVal
          ? `Tidak ada data pada ${formatShortDateKey(filterVal)}`
          : "Belum ada riwayat kerja.";
        container.innerHTML = `<div class="empty-state">${msg}</div>`;
        return;
      }

      const cardsHtml = sorted.map((rec, rIdx) => {
        const allPhotos = collectRecordPhotos(rec);
        const inIdx = allPhotos.findIndex(p => p.url === rec.checkInPhoto);
        const outIdx = allPhotos.findIndex(p => p.url === rec.checkOutPhoto);

        const inLateBadge = rec.checkInLate ? `<span class="chip-late-pill">Telat</span>` : "";
        const outLateBadge = rec.checkOutLate ? `<span class="chip-late-pill">Telat</span>` : "";

        const inChip = rec.checkIn
          ? (rec.checkInPhoto
              ? `<button type="button" class="time-chip ${rec.checkInLate ? "late" : "in"}" data-rec-idx="${rIdx}" data-photo-idx="${inIdx}">M ${rec.checkIn.slice(0, 5)} ${inLateBadge} <span class="chip-cam">Foto</span></button>`
              : `<span class="time-chip ${rec.checkInLate ? "late" : "in"}">M ${rec.checkIn.slice(0, 5)} ${inLateBadge}</span>`)
          : `<span class="time-chip empty">M --:--</span>`;

        const outChip = rec.checkOut
          ? (rec.checkOutPhoto
              ? `<button type="button" class="time-chip ${rec.checkOutLate ? "late" : "out"}" data-rec-idx="${rIdx}" data-photo-idx="${outIdx}">K ${rec.checkOut.slice(0, 5)} ${outLateBadge} <span class="chip-cam">Foto</span></button>`
              : `<span class="time-chip ${rec.checkOutLate ? "late" : "out"}">K ${rec.checkOut.slice(0, 5)} ${outLateBadge}</span>`)
          : `<span class="time-chip empty">K --:--</span>`;

        const cleanedNote = cleanNoteLines(rec.note);
        const notePhotos = Array.isArray(rec.notePhotos) ? rec.notePhotos : [];
        const thumbsHtml = notePhotos.length > 0
          ? `<div class="photo-thumbs">${notePhotos.map(u => {
              const pIdx = allPhotos.findIndex(p => p.url === u);
              return `<button type="button" class="photo-thumb-btn" data-rec-idx="${rIdx}" data-photo-idx="${pIdx >= 0 ? pIdx : 0}"><img src="${escapeHtml(u)}" alt="Doc"></button>`;
            }).join("")}</div>`
          : "";

        const noteSection = (cleanedNote || notePhotos.length > 0)
          ? `<div class="history-note-box">${cleanedNote ? `<div class="history-note-text">${escapeHtml(cleanedNote)}</div>` : ""}${thumbsHtml}</div>`
          : "";

        const whoBadge = isAdminModeActive()
          ? `<span class="badge badge-ok" style="margin-left:5px;">${escapeHtml(empNameMap[rec.empId] || rec.username || rec.empId)}</span>`
          : "";

        return `<div class="history-item"><div class="history-top"><div class="history-date-wrap"><span class="history-date">${formatShortDateKey(rec.date)}</span>${whoBadge}</div><div class="history-badges">${inChip}${outChip}</div></div>${noteSection}</div>`;
      }).join("");

      container.innerHTML = `<div class="history-list">${cardsHtml}</div>`;

      container.querySelectorAll("[data-rec-idx]").forEach(el => {
        el.addEventListener("click", () => {
          const rec = sorted[Number(el.dataset.recIdx)];
          const startIdx = Number(el.dataset.photoIdx) || 0;
          if (!rec) return;
          const allPhotos = collectRecordPhotos(rec);
          const ownerLabel = isAdminModeActive() ? ` • ${empNameMap[rec.empId] || rec.username || rec.empId}` : "";
          openPhotoGallery(allPhotos, startIdx, `${formatShortDateKey(rec.date)}${ownerLabel}`);
        });
      });
    }

    document.getElementById("calPrevBtn").addEventListener("click", () => {
      calMonth--;
      if (calMonth < 0) {
        calMonth = 11;
        calYear--;
      }
      renderCalendar("prev");
    });

    document.getElementById("calNextBtn").addEventListener("click", () => {
      calMonth++;
      if (calMonth > 11) {
        calMonth = 0;
        calYear++;
      }
      renderCalendar("next");
    });

    filterDateInput.addEventListener("change", (e) => {
      const val = e.target.value;
      updateFilterDateDisplay();
      if (val) {
        const [y, m] = val.split("-").map(Number);
        calYear = y;
        calMonth = m - 1;
      }
      renderCalendar();
      renderHistory();
    });

    document.getElementById("resetFilterDateBtn").addEventListener("click", () => {
      filterDateInput.value = "";
      updateFilterDateDisplay();
      renderCalendar();
      renderHistory();
    });

    // ================= INIT =================
    (function init() {
      updateFilterDateDisplay();

      try {
        const saved = JSON.parse(localStorage.getItem(SESSION_KEY));
        if (saved && saved.id && saved.username) {
          currentUser = saved;
          document.getElementById("displayUserName").textContent = saved.username;
          document.getElementById("displayUserId").textContent = `ID: ${saved.id}`;
          document.getElementById("userAvatar").textContent = (saved.username || "K").charAt(0);
          syncModeFromIndex();
        } else {
          window.location.href = "https://my.sitenexs.com/absen";
          return;
        }
      } catch {
        window.location.href = "https://my.sitenexs.com/absen";
        return;
      }

      renderCalendar();

      // Pantau status akun & mode admin secara real-time
      onSnapshot(doc(db, "absen_karyawan", currentUser.id), (snap) => {
        if (!snap.exists()) {
          localStorage.removeItem(SESSION_KEY);
          window.location.href = "https://my.sitenexs.com/absen";
          return;
        }
        currentUser = { ...currentUser, ...snap.data() };
        document.getElementById("displayUserName").textContent = currentUser.username || currentUser.id;
        document.getElementById("userAvatar").textContent = (currentUser.username || "K").charAt(0);
        syncModeFromIndex();
      });

      // Listen Riwayat Absensi pribadi user
      const qRec = query(collection(db, "absen_riwayat"), where("empId", "==", currentUser.id));
      onSnapshot(qRec, (snapshot) => {
        myRecords = snapshot.docs.map(d => d.data());
        renderCalendar();
        renderHistory();
      });

      // Listen Target & Pengingat pribadi user
      const qRem = query(collection(db, "absen_pengingat"), where("empId", "==", currentUser.id));
      onSnapshot(qRem, (snapshot) => {
        myTargets = snapshot.docs.map(d => ({ docId: d.id, ...d.data() }));
        const activeCount = myTargets.filter(r => !r.completed).length;
        const navBadge = document.getElementById("navTargetBadge");
        if (activeCount > 0) {
          navBadge.textContent = activeCount;
          navBadge.classList.remove("hidden");
        } else {
          navBadge.classList.add("hidden");
        }
        renderCalendar();
        renderHistory();
      });
    })();
  </script>
</body>
</html>
